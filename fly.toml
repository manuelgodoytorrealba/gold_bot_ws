# fly.toml app configuration file generated for gold-bot-ws on 2025-04-11T21:31:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gold-bot-ws'
primary_region = 'cdg'

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048

[processes]
  app = "node src/index.js"
