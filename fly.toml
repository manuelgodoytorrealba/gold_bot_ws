# fly.toml app configuration file generated for gold-bot-ws on 2025-04-11T21:31:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gold-bot-ws'
primary_region = 'cdg'

[build]
# No necesitas definir "command" aquí si usas [processes]

[processes]
app = "node src/index.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
